androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3-android = { group = "androidx.compose.material3", name = "material3-android", version = "1.4.0" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.1" }
androidx-material3-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version = "1.7.8" }
androidx-compose-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version = "1.1.1" }
androidx-compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics-android" }
androidx-preferences-ktx = { group = "androidx.preference", name = "preference-ktx", version = "1.2.1" }
mediasession = "androidx.media:media:1.7.1"
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }

mpv-lib = "io.github.abdallahmehiz:mpv-android-lib:0.1.9"
seeker = "com.github.abdallahmehiz:seeker:2.0.1"

material = "com.google.android.material:material:1.14.0-alpha05"

koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-android = { module = "io.insert-koin:koin-android" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-startup = { module = "io.insert-koin:koin-androidx-startup" }

compose-prefs = { module = "me.zhanghai.compose.preference:preference", version = "2.1.0" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }

detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
detekt-formatter = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-rules-compose = { module = "io.nlopez.compose.rules:detekt", version = "0.4.27" }

kotlinx-immutable-collections = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.4.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

truetype-parser = { module = "io.github.yubyf:truetypeparser-light", version = "2.1.4" }
fsaf = { module = "com.github.K1rakishou:Fuck-Storage-Access-Framework", version = "1.1.3" }

junrar = { module = "com.github.junrar:junrar", version = "7.5.5" }
commons-compress = { module = "org.apache.commons:commons-compress", version = "1.26.2" }

# W31.31:换 SMB 客户端 — smbj 0.13 sync full 设计在远程 QNAP NAS 上仍报
# "DiskShare has already been closed"(smbj 库内部协议层 bug)。换 jcifs-ng
# (Apache AgNO3 fork,Java CIFS/SMB1/2/3 client)。groupId eu.agno3.jcifs,
# 最新稳定版 2.1.9(GitHub 上 master 是 3.0.0-SNAPSHOT,但没发到 Maven Central)。
# jcifs-ng API 比 smbj 简洁(SmbFile + inputStream),跨平台稳定。
jcifs-ng = { module = "eu.agno3.jcifs:jcifs-ng", version = "2.1.9" }

# W31.32/W31.33:jcifs-ng 2.1.9 NTLM 认证内部用 MessageDigest.getInstance("MD4", "BC")
# 算 NTLMv1 hash(MD4(password.utf16le))。Android 从 API 28 起把内置 com.android.org.bouncycastle
# 阉割(去 MD2/MD4/RIPEMD160 等 legacy 算法,理由:不安全)。所以 Security.getProvider("BC")
# 拿到的 BC provider 没有 MD4,jcifs-ng 第一次 NTLM 握手就 NoSuchAlgorithmException。
# 修法:加 bcprov-jdk15on 全量 jar,App.onCreate 里 Security.removeProvider("BC") 移除阉割版
# 再 addProvider(BouncyCastleProvider()) 注册完整版。
#
# 用 jdk15on(不是 jdk18on!)因为 jcifs-ng 2.1.9 的 OSGi Import-Package 声明 org.bouncycastle*
# version="1.63" 范围,且运行时反射加载 org.bouncycastle.asn1.ASN1ApplicationSpecific 等类
# —— 这些类在 bcprov-jdk18on 1.78.1 已 API 重构移除(变成 ASN1ApplicationSpecificParser 等),
# 导致 ClassNotFoundException。换回 jdk15on(1.70 最新稳定)保证 API 兼容。
bcprov = { module = "org.bouncycastle:bcprov-jdk15on", version = "1.70" }

about-libs-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "about-libs" }
about-libs-ui-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "about-libs" }
simple-icons = { module = "br.com.devsrsouza.compose.icons:simple-icons", version = "1.1.1" }

[bundles]
koin = ["koin-core", "koin-android", "koin-compose", "koin-viewmodel", "koin-startup"]
about-libs = ["about-libs-core", "about-libs-ui-m3"]
compose-navigation3 = ["androidx-navigation3-runtime", "androidx-navigation3-ui"]

[plugins]
ksp = { id = "com.google.devtools.ksp", version = "2.2.20-2.0.3" }
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
about-libraries = { id = "com.mikepenz.aboutlibraries.plugin", version.ref = "about-libs" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }